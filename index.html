<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Síndico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral fixa + área de trabalho; no celular a barra vira navegação inferior. A fachada dos blocos é o elemento-assinatura. */
:root {
  --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #E9EEF3; --line: #D4DCE4;
  --fg: #14202B; --muted: #5A6B7B; --accent: #1C5D88; --accent-fg: #FFFFFF; --accent-soft: #DDEAF4;
  --ok: #2B8452; --ok-soft: #DDF1E5; --warn: #A86E12; --warn-soft: #F8ECD3; --bad: #BE3B33; --bad-soft: #F8DFDC;
  --window: #C9D4DE; --facade: #DCE3EA; --roof: #8C9AA8;
  --shadow: 0 1px 2px rgba(20,32,43,.06), 0 4px 16px rgba(20,32,43,.06);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E151B; --surface: #151F28; --surface-2: #1B2732; --line: #293845;
  --fg: #E3EAF0; --muted: #93A4B4; --accent: #6DB0DF; --accent-fg: #0E151B; --accent-soft: #1A3346;
  --ok: #5BC48A; --ok-soft: #173426; --warn: #E2A848; --warn-soft: #3A2C12; --bad: #EE7A71; --bad-soft: #3D1D1B;
  --window: #2C3B48; --facade: #1F2B36; --roof: #3B4B59;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #151F28; --surface-2: #1B2732; --line: #293845;
  --fg: #E3EAF0; --muted: #93A4B4; --accent: #6DB0DF; --accent-fg: #0E151B; --accent-soft: #1A3346;
  --ok: #5BC48A; --ok-soft: #173426; --warn: #E2A848; --warn-soft: #3A2C12; --bad: #EE7A71; --bad-soft: #3D1D1B;
  --window: #2C3B48; --facade: #1F2B36; --roof: #3B4B59;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; font-weight: 600; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; margin: 0; vertical-align: middle; }

/* Estrutura */
.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--f-display); font-size: .95rem; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: .75rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .badge { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px 10px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.main { min-width: 0; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head .eyebrow { margin-bottom: 4px; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.topbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.searchbtn { flex: 1; display: flex; align-items: center; gap: 10px; max-width: 460px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; color: var(--muted); cursor: pointer; text-align: left; }
.searchbtn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.searchbtn:hover { border-color: var(--accent); }
kbd { font-family: var(--f-mono); font-size: .7rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--muted); background: var(--surface-2); }

/* Componentes */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-2 { grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-res { grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); }
.kpi { display: flex; flex-direction: column; gap: 6px; }
button.kpi { text-align: left; cursor: pointer; width: 100%; transition: border-color .15s, transform .15s; }
button.kpi:hover { border-color: var(--accent); transform: translateY(-1px); }
.kpi .go { font-size: .75rem; color: var(--accent); font-weight: 500; margin-top: auto; padding-top: 2px; }
.kpi .val { font-family: var(--f-display); font-size: 1.55rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .sub { font-size: .8rem; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .87rem; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn[data-armed="1"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 600; display: inline-grid; place-items: center; }
.badge.info { background: var(--accent); color: var(--accent-fg); }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); font-weight: 500; white-space: nowrap; }
.unit-chip { font-family: var(--f-mono); font-size: .78rem; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; flex: none; }
.unit-chip:hover { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: .83rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; margin: 0; padding: 0; }
.list > li { list-style: none; display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; padding-top: 0; }
.li-main { flex: 1; min-width: 0; }
.li-main b { font-weight: 600; display: block; }
.li-main small { color: var(--muted); font-size: .8rem; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.month-nav { display: inline-flex; align-items: center; gap: 4px; }
.month-nav span { min-width: 150px; text-align: center; font-weight: 600; font-family: var(--f-display); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tabelas */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: .87rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { width: 34px; text-align: center; padding-right: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tbody tr.selected td { background: var(--accent-soft); }
.th-sort { border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
.th-sort:hover, .th-sort[aria-sort] { color: var(--fg); }
.bulk { position: sticky; bottom: 12px; margin-top: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); z-index: 5; }
.bulk .btn.ghost { color: var(--bg); }
.bulk .btn.ghost:hover { background: transparent; text-decoration: underline; }

/* Fachada */
.facades { display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: center; align-items: flex-end; }
.building { display: flex; flex-direction: column; align-items: stretch; flex: 1 1 150px; max-width: 232px; min-width: 0; }
.roof { background: var(--roof); color: #fff; font-family: var(--f-display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 5px; border-radius: 6px 6px 0 0; }
.floors { background: var(--facade); padding: 8px; display: grid; grid-template-columns: 22px repeat(4, minmax(0,1fr)); gap: 6px; border-inline: 1px solid var(--line); }
.floor-n { font-family: var(--f-mono); font-size: .65rem; color: var(--muted); display: grid; place-items: center; }
.win { position: relative; aspect-ratio: 1 / 1.05; border: 0; border-radius: 4px; background: var(--window); cursor: pointer; font-family: var(--f-mono); font-size: .66rem; color: var(--fg); display: grid; place-items: end center; padding-bottom: 3px; transition: transform .12s, opacity .2s, background-color .25s; }
.win:hover { transform: translateY(-2px) scale(1.04); z-index: 1; }
.win::before { content: ""; position: absolute; left: 18%; right: 18%; top: 14%; height: 34%; border-radius: 2px; background: currentColor; opacity: .18; }
.win.dim { opacity: .2; }
.win .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid var(--facade); }
.win .cnt { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font: 600 .6rem/1 var(--f-body); display: grid; place-items: center; border: 2px solid var(--facade); }
.win .cnt.w { background: var(--warn); color: #fff; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.em-dia { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
.aberto, .c-neutral { background: var(--window); color: var(--muted); }
.inadimplente { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.c-accent { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.c-warn { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.c-alt { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--roof); }
.ground { background: var(--facade); border: 1px solid var(--line); border-top: 2px solid var(--roof); border-radius: 0 0 6px 6px; display: flex; justify-content: center; padding-top: 6px; }
.door { width: 46px; height: 26px; border-radius: 4px 4px 0 0; background: var(--roof); color: #fff; font-size: .55rem; display: grid; place-items: center; letter-spacing: .06em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: .78rem; color: var(--muted); margin-top: 14px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Gráfico */
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .b-rec { fill: var(--accent); }
.chart .b-desp { fill: var(--roof); }
.chart .cur { fill: var(--fg); font-weight: 600; }
.chart .bar-g { cursor: pointer; }
.chart .hit { fill: transparent; }
.chart .bar-g:hover .hit { fill: var(--surface-2); }
.hbar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0,1fr) auto; gap: 10px; align-items: center; font-size: .84rem; padding: 5px 0; }
.hbar .bar { height: 8px; }

/* Ocorrências */
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 140px; transition: background-color .15s; }
.col.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; cursor: grab; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card.dragging { opacity: .4; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.p-alta::before { background: var(--bad); }
.card.p-media::before { background: var(--warn); }
.card.p-baixa::before { background: var(--ok); }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -23px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline time { display: block; font-size: .75rem; color: var(--muted); }
.timeline span { white-space: pre-wrap; }

/* Calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cal .dow { padding: 6px; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; background: var(--surface-2); font-weight: 600; }
.cal .day { min-height: 92px; padding: 5px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; transition: background-color .12s; }
.cal .day:hover { background: var(--accent-soft); }
.cal .day.past { cursor: default; }
.cal .day.past:hover { background: transparent; }
.cal .day:nth-child(7n+1) { border-left: 0; }
.cal .day.out { background: var(--surface-2); opacity: .55; }
.cal .day.today .dn { background: var(--accent); color: var(--accent-fg); }
.cal .dn { font-size: .75rem; font-variant-numeric: tabular-nums; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; flex: none; }
.ev { font-size: .68rem; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; border: 0; text-align: left; font-family: inherit; flex: none; }
button.ev { cursor: pointer; width: 100%; }
button.ev:hover { filter: brightness(.95); box-shadow: inset 0 0 0 1px currentColor; }
.a-salao { background: var(--accent-soft); color: var(--accent); }
.a-churrasqueira { background: var(--warn-soft); color: var(--warn); }
.a-gourmet { background: var(--ok-soft); color: var(--ok); }
.a-quadra { background: var(--bad-soft); color: var(--bad); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px 3px 8px; font-size: .78rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--fg); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.avail { display: grid; grid-template-columns: minmax(0,1.3fr) repeat(3, minmax(0,1fr)); gap: 5px; font-size: .8rem; align-items: center; }
.avail .h { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; text-align: center; font-weight: 600; }
.slot { border: 1px solid var(--line); border-radius: 6px; padding: 7px 4px; text-align: center; cursor: pointer; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: .74rem; }
.slot:hover { border-color: var(--ok); }
.slot.busy { background: var(--surface-2); color: var(--muted); cursor: not-allowed; font-weight: 500; font-family: var(--f-mono); }
.slot.sel { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Avisos */
.notice { display: flex; flex-direction: column; gap: 8px; }
.notice p { margin: 0; max-width: 68ch; white-space: pre-wrap; }
.notice.pinned { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

/* Formulários */
.form { display: grid; gap: 12px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .8rem; font-weight: 500; color: var(--muted); min-width: 0; }
.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: .9rem; color: var(--fg); }
.in:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea.in { resize: vertical; min-height: 90px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .in { padding-left: 34px; }
.form-err { color: var(--bad); font-size: .83rem; margin: 0; }

/* Modal, busca, toast, tooltip */

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const round2 = v => Math.round(v * 100) / 100;
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = v => BRL.format(v);
const moneyShort = v => Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mil' : money(v);
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const fmtDate = s => parseISO(s).toLocaleDateString('pt-BR');
const fmtShort = s => parseISO(s).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
const fmtTime = s => new Date(s).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDateTime = s => new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).replace('.', '');
const nowISO = () => new Date().toISOString();
const localDay = s => iso(new Date(s));
const ago = s => { const m = Math.round((Date.now() - new Date(s)) / 6e4); if (m < 1) return 'agora'; if (m < 60) return `há ${m} min`; const h = Math.round(m / 60); if (h < 24) return `há ${h} h`; const d = Math.round(h / 24); return `há ${d} dia${d > 1 ? 's' : ''}`; };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return `${MESES[m - 1]} de ${y}`; };
const monthAbbr = k => MESES[Number(k.split('-')[1]) - 1].slice(0, 3);
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); return ym(new Date(y, m - 1 + n, 1)); };
const uid = () => Math.random().toString(36).slice(2, 9);
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`;
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TODAY_ISO = iso(TODAY);
const CUR = ym(TODAY);
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const ICON = {
  painel: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  unidades: 'M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3',
  financeiro: 'M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h1',
  ocorrencias: 'M12 3l9.5 17h-19zM12 10v4M12 17.5v.5',
  reservas: 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',
  portaria: 'M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9',
  avisos: 'M3 10v4h4l6 4V6L7 10zM17 9a4 4 0 0 1 0 6',
  plus: 'M12 5v14M5 12h14', x: 'M6 6l12 12M18 6L6 18',
  left: 'M15 6l-6 6 6 6', right: 'M9 6l6 6-6 6', search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
  pin: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v7', copy: 'M9 9h11v11H9zM5 15H4V4h11v1', edit: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',
  sun: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
  moon: 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z', auto: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18'
};
const ico = n => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;

/* ---------- dados ---------- */
const KEY = 'painel-sindico-v1';
const AREAS = { salao: 'Salão de festas', churrasqueira: 'Churrasqueira', gourmet: 'Espaço gourmet', quadra: 'Quadra' };
const PERIODOS = { manha: 'Manhã (8h–12h)', tarde: 'Tarde (13h–18h)', noite: 'Noite (18h–23h)' };
const PER_SHORT = { manha: 'Manhã', tarde: 'Tarde', noite: 'Noite' };
const CATS_DESP = ['Pessoal', 'Energia', 'Água e esgoto', 'Manutenção', 'Limpeza', 'Administração', 'Seguro', 'Jardinagem', 'Outros'];
const CATS_OC = ['Manutenção', 'Barulho', 'Segurança', 'Limpeza', 'Garagem', 'Outros'];
const TRANSP = ['Correios', 'Mercado Livre', 'Amazon', 'Shopee', 'Jadlog', 'Loggi', 'Outra'];
const TIPOS_VIS = ['Visita', 'Prestador de serviço', 'Entregador', 'Corretor'];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const relDay = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return iso(d); };

function seedPortaria() {
  const r = rng(77);
  const ids = ['A101', 'A203', 'A304', 'A402', 'A503', 'A604', 'B102', 'B201', 'B303', 'B404', 'B502', 'B601'];
  const desc = ['Caixa média', 'Envelope', 'Caixa pequena', 'Pacote', 'Caixa grande'];
  const now = Date.now(), at = h => new Date(now - h * 36e5).toISOString();
  const parcels = [];
  for (let i = 0; i < 13; i++) {
    const pend = i < 7, ch = pend ? 1 + r() * 90 : 30 + r() * 120;
    parcels.push({ id: uid(), unitId: ids[(i * 7) % ids.length], transportadora: TRANSP[Math.floor(r() * 6)], descricao: desc[Math.floor(r() * desc.length)], chegada: at(ch), retiradaEm: pend ? null : at(ch - 2 - r() * 20), retiradoPor: null });
  }
  const vis = [['Marcos Silva', 'Visita'], ['Juliana Prado', 'Visita'], ['Técnico de internet', 'Prestador de serviço'], ['Roberto Assis', 'Visita'], ['Eletricista Paulo', 'Prestador de serviço'], ['Fernanda Luz', 'Visita'], ['Diarista Cida', 'Prestador de serviço'], ['Carlos Mendes', 'Corretor']];
  const visitors = vis.map(([nome, tipo], i) => { const inside = i < 3, ent = inside ? 0.3 + r() * 2.5 : 3 + r() * 6; return { id: uid(), nome, tipo, unitId: ids[(i * 5) % ids.length], entrada: at(ent), saida: inside ? null : at(ent - 0.5 - r() * 2) }; });
  return { parcels, visitors };
}

function seed() {
  const r = rng(20261111);
  const pick = a => a[Math.floor(r() * a.length)];
  const nomes = ['Ana', 'Bruno', 'Carla', 'Daniel', 'Eduarda', 'Felipe', 'Gabriela', 'Henrique', 'Isabela', 'João', 'Larissa', 'Marcelo', 'Natália', 'Otávio', 'Patrícia', 'Rafael', 'Sofia', 'Thiago', 'Vanessa', 'Wagner', 'Beatriz', 'Caio', 'Renata', 'Lucas'];
  const sobren = ['Almeida', 'Barros', 'Costa', 'Duarte', 'Ferreira', 'Gomes', 'Lima', 'Martins', 'Nogueira', 'Oliveira', 'Pereira', 'Ribeiro', 'Santos', 'Teixeira', 'Vieira', 'Moura', 'Cardoso', 'Rocha'];
  const units = [];
  for (const b of ['A', 'B']) for (let andar = 1; andar <= 6; andar++) for (let f = 1; f <= 4; f++) {
    const area = (f === 1 || f === 4) ? 74 : 58;
    units.push({ id: `${b}${andar}0${f}`, bloco: b, numero: `${andar}0${f}`, andar, area, vagas: area === 74 ? 2 : 1,
      morador: `${pick(nomes)} ${pick(sobren)}`, telefone: `(11) 9${Math.floor(1000 + r() * 8999)}-${Math.floor(1000 + r() * 8999)}`,
      tipo: r() < 0.7 ? 'Proprietário' : 'Inquilino' });
  }
  const totalArea = units.reduce((s, u) => s + u.area, 0);
  const ORC = 38000;
  units.forEach(u => { u.fracao = u.area / totalArea; u.taxa = round2(ORC * u.fracao); });

  const devedores = { A302: 3, B504: 2, B103: 1 };
  const charges = [];
  for (let k = -5; k <= 0; k++) {
    const key = shiftMonth(CUR, k), venc = `${key}-10`, due = parseISO(venc);
    for (const u of units) {
      let pagoEm = null;
      if (devedores[u.id] && k >= -devedores[u.id]) pagoEm = null;
      else if (due < TODAY) {
        if (k < 0 || r() < 0.95) { const d = new Date(due); d.setDate(d.getDate() - Math.floor(r() * 9) + (r() < 0.12 ? 4 : 0)); pagoEm = iso(d > TODAY ? TODAY : d); }
      } else if (r() < 0.35) {
        const start = parseISO(`${key}-01`); const span = Math.max(0, daysBetween(start, TODAY));
        const d = new Date(start); d.setDate(d.getDate() + Math.floor(r() * (span + 1))); pagoEm = iso(d);
      }
      charges.push({ id: uid(), unitId: u.id, competencia: key, vencimento: venc, valor: u.taxa, pagoEm });
    }
  }

  const base = [
    ['Pessoal', 'Folha de portaria e zeladoria', 5, 16800, 0], ['Energia', 'Energia das áreas comuns', 12, 3200, 450],
    ['Água e esgoto', 'Conta de água e esgoto', 15, 4800, 600], ['Manutenção', 'Contrato de manutenção dos elevadores', 8, 1650, 0],
    ['Limpeza', 'Material de limpeza e terceirizada', 20, 1900, 250], ['Administração', 'Taxa da administradora', 5, 2200, 0],
    ['Seguro', 'Seguro predial (parcela)', 25, 980, 0], ['Jardinagem', 'Manutenção do jardim', 18, 650, 120]
  ];
  const avulsas = ['Troca do motor do portão da garagem', 'Reparo hidráulico na prumada do Bloco B', 'Pintura do hall do Bloco A', 'Recarga de extintores', 'Dedetização semestral', 'Troca de lâmpadas LED das escadas'];
  const expenses = [];
  for (let k = -5; k <= 0; k++) {
    const key = shiftMonth(CUR, k);
    for (const [cat, desc, day, val, varr] of base) {
      if (k === 0 && day > TODAY.getDate()) continue;
      expenses.push({ id: uid(), data: `${key}-${pad(day)}`, categoria: cat, descricao: desc, valor: round2(val + (r() - 0.5) * 2 * varr) });
    }
    if (k < 0 || TODAY.getDate() > 14) expenses.push({ id: uid(), data: `${key}-14`, categoria: k % 2 ? 'Manutenção' : 'Outros', descricao: avulsas[(k + 5) % avulsas.length], valor: round2(600 + r() * 2400) });
  }

  const at = (d, h) => `${relDay(Math.min(0, d))}T${h}:00`;
  const incidents = [
    ['Elevador social do Bloco A parando entre andares', null, 'Manutenção', 'alta', 'andamento', -3, 'Empresa de manutenção acionada. Técnico agendado para amanhã às 9h.'],
    ['Infiltração na parede da sala', 'A304', 'Manutenção', 'alta', 'aberta', -1, null],
    ['Barulho após as 22h em dias de semana', 'B402', 'Barulho', 'media', 'aberta', -2, null],
    ['Lâmpada queimada no hall do 4º andar do Bloco B', null, 'Manutenção', 'baixa', 'aberta', 0, null],
    ['Portão da garagem fechando devagar', null, 'Garagem', 'media', 'andamento', -6, 'Orçamento solicitado a duas empresas.'],
    ['Interfone da unidade sem áudio', 'A101', 'Manutenção', 'baixa', 'aberta', -4, null],
    ['Cachorro solto no playground', 'B206', 'Segurança', 'media', 'resolvida', -9, 'Morador notificado sobre o regimento interno.'],
    ['Vazamento no teto da garagem, vaga 31', null, 'Garagem', 'alta', 'resolvida', -12, 'Impermeabilização refeita pela equipe de manutenção.'],
    ['Pedido de poda da árvore da entrada', null, 'Outros', 'baixa', 'resolvida', -15, null]
  ].map(([titulo, unitId, categoria, prioridade, status, d, nota]) => {
    const historico = [{ em: at(d, '09:12'), texto: 'Ocorrência registrada pela portaria' }];
    if (status !== 'aberta') historico.push({ em: at(d + 1, '10:30'), texto: 'Status alterado para Em andamento' });
    if (nota) historico.push({ em: at(d + 1, '15:05'), texto: nota });
    if (status === 'resolvida') historico.push({ em: at(d + 3, '11:40'), texto: 'Status alterado para Resolvida' });
    return { id: uid(), titulo, unitId, categoria, prioridade, status, data: relDay(d), historico };
  });

  const bookings = [
    ['salao', 'A203', -4, 'noite'], ['churrasqueira', 'B601', 1, 'tarde'], ['gourmet', 'A402', 2, 'noite'],
    ['salao', 'B104', 5, 'tarde'], ['quadra', 'A604', 3, 'manha'], ['churrasqueira', 'A101', 8, 'tarde'],
    ['salao', 'B303', 12, 'noite'], ['gourmet', 'B202', 15, 'tarde'], ['quadra', 'B404', 9, 'manha'], ['churrasqueira', 'A503', 5, 'noite']
  ].map(([area, unitId, d, periodo]) => ({ id: uid(), area, unitId, data: relDay(d), periodo }));

  const notices = [
    { id: uid(), titulo: 'Assembleia Geral Ordinária', data: relDay(-2), fixado: true,
      texto: `Convocamos os condôminos para a AGO no dia ${fmtDate(relDay(17))}, no salão de festas.\n1ª convocação às 19h30, 2ª convocação às 20h.\nPauta: prestação de contas, previsão orçamentária e eleição do conselho fiscal.` },
    { id: uid(), titulo: 'Limpeza das caixas d\'água', data: relDay(-5), fixado: false,
      texto: `No dia ${fmtDate(relDay(6))} faremos a limpeza semestral das caixas d'água. O abastecimento será interrompido das 8h às 14h nos dois blocos.` },
    { id: uid(), titulo: 'Manutenção preventiva dos elevadores do Bloco B', data: relDay(-8), fixado: false,
      texto: 'Um elevador por vez ficará parado entre 9h e 12h na próxima terça-feira. Pedimos paciência.' }
  ];

  return { condo: { nome: 'Residencial Jardim das Acácias', saldoInicial: 142380 }, units, charges, expenses, incidents, bookings, notices, ...seedPortaria() };
}

let db;
function migrate() {
  if (!db.parcels || !db.visitors) { const p = seedPortaria(); db.parcels = db.parcels || p.parcels; db.visitors = db.visitors || p.visitors; }
  db.incidents.forEach(i => { if (!i.historico) i.historico = [{ em: `${i.data}T09:00:00`, texto: 'Ocorrência registrada' }]; });
}
function load() { try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); migrate(); return; } } catch (e) {} db = seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
load();

/* ---------- regras ---------- */
const unitById = id => db.units.find(u => u.id === id);
const unitLabel = id => { const u = unitById(id); return u ? `${u.bloco}-${u.numero}` : '—'; };
function chargeStatus(c) { if (c.pagoEm) return 'pago'; return parseISO(c.vencimento) < TODAY ? 'atrasado' : 'aberto'; }
// Multa de 2% (Código Civil, art. 1.336 §1º) + juros de 1% ao mês pro rata
function atualizado(c) {
  if (chargeStatus(c) !== 'atrasado') return c.valor;
  const dias = daysBetween(parseISO(c.vencimento), TODAY);
  return round2(c.valor * (1 + 0.02 + 0.01 * dias / 30));
}
function unitStatus(id) {
  const cs = db.charges.filter(c => c.unitId === id);
  if (cs.some(c => chargeStatus(c) === 'atrasado')) return 'inadimplente';
  const cur = cs.find(c => c.competencia === CUR);
  return !cur || cur.pagoEm ? 'em-dia' : 'aberto';
}
const unitDebt = id => round2(db.charges.filter(c => c.unitId === id && chargeStatus(c) === 'atrasado').reduce((s, c) => s + atualizado(c), 0));
const STATUS_TXT = { 'em-dia': 'Em dia', aberto: 'A vencer', inadimplente: 'Inadimplente' };
const STATUS_PILL = { 'em-dia': 'ok', aberto: 'neutral', inadimplente: 'bad' };
const CH_TXT = { pago: 'Pago', aberto: 'A vencer', atrasado: 'Atrasado' };
const CH_PILL = { pago: 'ok', aberto: 'neutral', atrasado: 'bad' };
const OC_TXT = { aberta: 'Aberta', andamento: 'Em andamento', resolvida: 'Resolvida' };
const PRI_TXT = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const PRI_PILL = { alta: 'bad', media: 'warn', baixa: 'ok' };
const PRI_ORD = { alta: 0, media: 1, baixa: 2 };
const openIncidents = () => db.incidents.filter(i => i.status !== 'resolvida');
const pendingParcels = () => db.parcels.filter(p => !p.retiradaEm);
function monthSummary(key) {
  const cs = db.charges.filter(c => c.competencia === key);
  const previsto = cs.reduce((s, c) => s + c.valor, 0);
  const recebido = cs.filter(c => c.pagoEm).reduce((s, c) => s + c.valor, 0);
  const despesas = db.expenses.filter(e => e.data.startsWith(key)).reduce((s, e) => s + e.valor, 0);
  return { cs, previsto: round2(previsto), recebido: round2(recebido), aberto: round2(previsto - recebido), despesas: round2(despesas) };
}
function saldoCaixa() {
  const rec = db.charges.filter(c => c.pagoEm).reduce((s, c) => s + c.valor, 0);
  const desp = db.expenses.reduce((s, e) => s + e.valor, 0);
  return round2(db.condo.saldoInicial + rec - desp);
}

};

/* Fachada */
const FACADE_MODES = {
  pagamento: { label: 'Pagamento', legend: [['em-dia', 'Em dia'], ['aberto', 'A vencer'], ['inadimplente', 'Inadimplente']] },
  ocorrencias: { label: 'Ocorrências', legend: [['c-warn', 'Com ocorrência aberta'], ['c-neutral', 'Sem ocorrência']] },
  vinculo: { label: 'Vínculo', legend: [['c-accent', 'Proprietário'], ['c-alt', 'Inquilino']] },
  encomendas: { label: 'Encomendas', legend: [['c-accent', 'Encomenda na portaria'], ['c-neutral', 'Nada pendente']] }
};
const modeSeg = () => `<div class="seg" role="group" aria-label="Colorir fachada por">${Object.entries(FACADE_MODES).map(([k, m]) => `<button type="button" data-action="facade-mode" data-v="${k}" aria-pressed="${ui.facadeMode === k}">${m.label}</button>`).join('')}</div>`;
function facade(filterFn) {
  const ocBy = {}, pkBy = {};
  openIncidents().forEach(i => { if (i.unitId) ocBy[i.unitId] = (ocBy[i.unitId] || 0) + 1; });
  pendingParcels().forEach(p => { pkBy[p.unitId] = (pkBy[p.unitId] || 0) + 1; });
  const mode = ui.facadeMode;
  const blocks = ['A', 'B'].map(b => {
    let rows = '';
    for (let andar = 6; andar >= 1; andar--) {
      rows += `<span class="floor-n">${andar}º</span>`;
      for (let f = 1; f <= 4; f++) {
        const u = unitById(`${b}${andar}0${f}`); if (!u) { rows += '<span></span>'; continue; }
        const st = unitStatus(u.id), oc = ocBy[u.id] || 0, pk = pkBy[u.id] || 0, debt = st === 'inadimplente' ? unitDebt(u.id) : 0;
        let cls = st, badge = oc ? '<span class="dot"></span>' : '';
        if (mode === 'ocorrencias') { cls = oc ? 'c-warn' : 'c-neutral'; badge = oc ? `<span class="cnt w">${oc}</span>` : ''; }
        if (mode === 'vinculo') { cls = u.tipo === 'Proprietário' ? 'c-accent' : 'c-alt'; badge = ''; }
        if (mode === 'encomendas') { cls = pk ? 'c-accent' : 'c-neutral'; badge = pk ? `<span class="cnt">${pk}</span>` : ''; }
        const tip = `${b}-${u.numero} · ${u.morador}\n${STATUS_TXT[st]}${debt ? ` · débito ${money(debt)}` : ''}\n${u.tipo} · ${u.area} m² · ${money(u.taxa)}/mês${oc ? `\n${plural(oc, 'ocorrência aberta', 'ocorrências abertas')}` : ''}${pk ? `\n${plural(pk, 'encomenda na portaria', 'encomendas na portaria')}` : ''}`;
        const dim = filterFn && !filterFn(u) ? ' dim' : '';
        rows += `<button type="button" class="win ${cls}${dim}" data-action="unit" data-id="${u.id}" data-tip="${esc(tip)}" aria-label="Unidade ${b}-${u.numero}, ${STATUS_TXT[st]}">${u.numero}${badge}</button>`;
      }
    }
    return `<div class="building"><div class="roof">Bloco ${b}</div><div class="floors">${rows}</div><div class="ground"><div class="door">Portaria</div></div></div>`;
  }).join('');
  const legend = FACADE_MODES[mode].legend.map(([c, t]) => `<span><i class="sw ${c}"></i>${t}</span>`).join('') + (mode === 'pagamento' ? '<span><i class="sw" style="background:var(--warn);border-radius:50%"></i>Ocorrência aberta</span>' : '');
  return `<div class="facades">${blocks}</div><div class="legend">${legend}</div>`;
}

function chart() {
  const months = []; for (let k = -5; k <= 0; k++) months.push(shiftMonth(CUR, k));
  const data = months.map(m => { const s = monthSummary(m); return { m, rec: s.recebido, desp: s.despesas }; });
  const W = 560, H = 230, L = 48, B = 26, T = 12, R = 8;
  const maxV = Math.max(...data.flatMap(d => [d.rec, d.desp]));
  const step = 10000, top = Math.ceil(maxV / step) * step || step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / data.length, bw = Math.min(26, gw / 3.2);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e despesas dos últimos seis meses">`;
  for (let v = 0; v <= top; v += step) s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v / 1000}k</text>`;
  data.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    const tip = `${cap(monthLabel(d.m))}${d.m === CUR ? ' (parcial)' : ''}\nReceitas: ${money(d.rec)}\nDespesas: ${money(d.desp)}\nResultado: ${money(d.rec - d.desp)}\nClique para abrir o mês`;
    s += `<g class="bar-g" data-action="chart-month" data-m="${d.m}" data-tip="${esc(tip)}"><rect class="hit" x="${L + gw * i + 2}" y="${T}" width="${gw - 4}" height="${H - T - B}" rx="6"/>`;
    s += `<rect class="b-rec" x="${cx - bw - 2}" y="${y(d.rec)}" width="${bw}" height="${y(0) - y(d.rec)}" rx="3"/>`;
    s += `<rect class="b-desp" x="${cx + 2}" y="${y(d.desp)}" width="${bw}" height="${y(0) - y(d.desp)}" rx="3"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="${d.m === CUR ? 'cur' : ''}">${monthAbbr(d.m)}</text></g>`;
  });
  return s + '</svg><div class="legend" style="justify-content:flex-start;margin-top:6px"><span><i style="background:var(--accent)"></i>Receitas recebidas</span><span><i style="background:var(--roof)"></i>Despesas pagas</span><span>Passe o mouse ou clique numa barra</span></div>';
}

/* ----- Unidades ----- */
function unitMatches(u) {
  const q = ui.unitQuery.trim().toLowerCase();
  if (q && !(`${u.bloco}-${u.numero} ${u.bloco}${u.numero} ${u.morador}`.toLowerCase().includes(q))) return false;
  if (ui.unitFilter !== 'todas' && unitStatus(u.id) !== ui.unitFilter) return false;
  return true;
}
const SORTS = { unidade: u => u.id, morador: u => u.morador, area: u => u.area, taxa: u => u.taxa, debito: u => unitDebt(u.id) };
function unitsTable() {
  const { k, dir } = ui.unitSort;
  const rows = db.units.filter(unitMatches).sort((a, b) => { const x = SORTS[k](a), y = SORTS[k](b); return (typeof x === 'number' ? x - y : x.localeCompare(y, 'pt-BR')) * dir; });
  if (!rows.length) return '<div class="empty">Nenhuma unidade encontrada para esse filtro.</div>';
  const th = (key, t, cls = '') => `<th class="${cls}"><button type="button" class="th-sort" data-action="sort" data-k="${key}" ${k === key ? `aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}>${t}${k === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</button></th>`;
  return `<div class="table-wrap"><table><thead><tr>${th('unidade', 'Unidade')}${th('morador', 'Morador')}<th>Vínculo</th>${th('area', 'Área', 'r')}${th('taxa', 'Taxa mensal', 'r')}<th>Situação</th>${th('debito', 'Débito atualizado', 'r')}</tr></thead><tbody>
  ${rows.map(u => { const st = unitStatus(u.id), d = unitDebt(u.id); return `<tr class="click" data-action="unit" data-id="${u.id}" tabindex="0"><td class="mono">${u.bloco}-${u.numero}</td><td>${esc(u.morador)}</td><td><span class="tag">${u.tipo}</span></td><td class="r">${u.area} m²</td><td class="r">${money(u.taxa)}</td><td><span class="pill ${STATUS_PILL[st]}">${STATUS_TXT[st]}</span></td><td class="r" style="${d ? 'color:var(--bad);font-weight:600' : ''}">${d ? money(d) : '—'}</td></tr>`; }).join('')}
  </tbody></table></div><p class="muted" style="font-size:.75rem;margin:10px 0 0">${plural(rows.length, 'unidade')} · clique no título de uma coluna para ordenar</p>`;
}
function vUnidades() {
  const counts = { todas: db.units.length };
  db.units.forEach(u => { const s = unitStatus(u.id); counts[s] = (counts[s] || 0) + 1; });
  const seg = [['todas', 'Todas'], ['em-dia', 'Em dia'], ['aberto', 'A vencer'], ['inadimplente', 'Inadimplentes']]
    .map(([k, t]) => `<button type="button" data-action="unit-filter" data-v="${k}" aria-pressed="${ui.unitFilter === k}">${t} <span class="muted">${counts[k] || 0}</span></button>`).join('');

  `<div class="panel"><div class="panel-head"><h2>Fachada</h2>${modeSeg()}</div><div id="facade-box">${facade(unitMatches)}</div></div>
   <div class="panel"><div class="panel-head"><div class="search">${ico('search')}<input class="in" id="busca-unidade" type="search" placeholder="Buscar por unidade ou morador" value="${esc(ui.unitQuery)}" aria-label="Buscar unidade"></div><div class="seg" role="group" aria-label="Filtrar situação">${seg}</div></div><div id="units-table">${unitsTable()}</div></div>`;
}
function cobrancaMsg(u) {
  const cs = db.charges.filter(c => c.unitId === u.id && chargeStatus(c) === 'atrasado').sort((a, b) => a.competencia.localeCompare(b.competencia));

}
function openUnit(id, refresh) {
  const u = unitById(id); if (!u) return;
  const cs = db.charges.filter(c => c.unitId === id).sort((a, b) => b.competencia.localeCompare(a.competencia));
  const st = unitStatus(id), debt = unitDebt(id);
  const ocs = db.incidents.filter(i => i.unitId === id);
  const pk = db.parcels.filter(p => p.unitId === id && !p.retiradaEm);
  const bk = db.bookings.filter(b => b.unitId === id && b.data >= TODAY_ISO);

/* ----- Reservas ----- */
function vReservas() {
  const k = ui.calMonth, [y, m] = k.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(first); start.setDate(1 - first.getDay());
  let cells = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const di = iso(d);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const evs = db.bookings.filter(b => b.data === di && !ui.calHide.has(b.area)).sort((a, b) => Object.keys(PERIODOS).indexOf(a.periodo) - Object.keys(PERIODOS).indexOf(b.periodo));
    const past = di < TODAY_ISO;
    cells += `<div class="day ${d.getMonth() !== m - 1 ? 'out' : ''} ${di === TODAY_ISO ? 'today' : ''} ${past ? 'past' : ''}" ${past ? '' : `data-action="day" data-date="${di}" title="Reservar em ${fmtDate(di)}"`}><span class="dn">${d.getDate()}</span>${evs.map(b => `<button type="button" class="ev a-${b.area}" data-action="booking" data-id="${b.id}" data-tip="${esc(`${AREAS[b.area]}\n${unitLabel(b.unitId)} · ${PERIODOS[b.periodo]}`)}">${PER_SHORT[b.periodo].slice(0, 3)} ${unitLabel(b.unitId)}</button>`).join('')}</div>`;
  }
  const prox = db.bookings.filter(b => b.data >= TODAY_ISO && !ui.calHide.has(b.area)).sort((a, b) => a.data.localeCompare(b.data));
  return head('Áreas comuns · clique num dia para reservar', 'Reservas', `<button class="btn primary" type="button" data-action="new-booking">${ico('plus')}Nova reserva</button>`) +
  `<section class="grid g-2 g-res" style="align-items:start">
    <div class="panel"><div class="panel-head"><div class="month-nav"><button class="icon-btn" type="button" data-action="cal-month" data-d="-1" aria-label="Mês anterior">${ico('left')}</button><span>${cap(monthLabel(k))}</span><button class="icon-btn" type="button" data-action="cal-month" data-d="1" aria-label="Próximo mês">${ico('right')}</button></div>
      <div class="actions">${Object.entries(AREAS).map(([a, t]) => `<button type="button" class="chip" data-action="cal-area" data-v="${a}" aria-pressed="${!ui.calHide.has(a)}"><i class="a-${a}"></i>${t}</button>`).join('')}</div></div>
      <div style="overflow-x:auto"><div class="cal">${cells}</div></div></div>
    <div class="panel"><div class="panel-head"><h2>Próximas</h2><span class="tag">${prox.length}</span></div>
      ${prox.length ? `<ul class="list">${prox.map(b => `<li data-action="booking" data-id="${b.id}" style="cursor:pointer"><span class="ev a-${b.area}" style="font-size:.75rem">${fmtShort(b.data)}</span><div class="li-main"><b>${AREAS[b.area]}</b><small>${unitLabel(b.unitId)} · ${PERIODOS[b.periodo]}</small></div><button class="btn sm ghost danger" type="button" data-action="del-booking" data-id="${b.id}">Cancelar</button></li>`).join('')}</ul>` : '<div class="empty">Nenhuma reserva futura.</div>'}
    </div></section>`;
}
function newBooking(pre = {}) {

    <div class="row"><label class="f">Unidade<select class="in" id="b-unit" name="unitId">${unitOptions(pre.unitId || 'A101')}</select></label>
    <label class="f">Data<input class="in" id="b-data" type="date" name="data" required min="${TODAY_ISO}" value="${pre.data || TODAY_ISO}"></label></div>
    <input type="hidden" id="b-area" name="area" value=""><input type="hidden" id="b-per" name="periodo" value="">

function updateAvail() {
  const box = $('#avail'); if (!box) return;
  const data = $('#b-data').value;
  let selA = $('#b-area').value, selP = $('#b-per').value;
  if (selA && db.bookings.some(x => x.area === selA && x.data === data && x.periodo === selP)) { selA = selP = ''; $('#b-area').value = ''; $('#b-per').value = ''; }
  let h = '<span></span>' + Object.keys(PERIODOS).map(p => `<span class="h">${PER_SHORT[p]}</span>`).join('');
  for (const [a, t] of Object.entries(AREAS)) {
    h += `<span>${t}</span>`;
    for (const p of Object.keys(PERIODOS)) {
      const b = db.bookings.find(x => x.area === a && x.data === data && x.periodo === p), sel = a === selA && p === selP;
      h += b ? `<button type="button" class="slot busy" disabled title="Reservado por ${unitLabel(b.unitId)}">${unitLabel(b.unitId)}</button>`
        : `<button type="button" class="slot${sel ? ' sel' : ''}" data-action="pick-slot" data-a="${a}" data-p="${p}" aria-pressed="${sel}" aria-label="${t}, ${PER_SHORT[p]}">${sel ? 'Escolhido' : 'Livre'}</button>`;
    }
  }
  box.innerHTML = h;

/* ---------- busca rápida ---------- */
let palItems = [], palIdx = 0;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function palSearch(q) {
  const qq = norm(q.trim());
  const acts = [['Novo aviso', () => newNotice()], ['Registrar ocorrência', () => newOc()], ['Nova reserva', () => newBooking()], ['Registrar encomenda', () => newParcel()], ['Registrar visitante', () => newVisitor()], ['Lançar despesa', () => { ui.finTab = 'despesas'; go('financeiro'); }]]
    .map(([t, run]) => ({ group: 'Ações', title: t, run }));
  const pages = NAV.map(([k, t]) => ({ group: 'Ir para', title: t, run: () => go(k) }));
  if (!qq) return [...acts, ...pages];
  const units = db.units.map(u => ({ group: 'Unidades', title: `${u.bloco}-${u.numero} · ${u.morador}`, sub: STATUS_TXT[unitStatus(u.id)], key: `${u.bloco}${u.numero} ${u.bloco}-${u.numero} ${u.morador}`, run: () => openUnit(u.id) }));
  const ocs = db.incidents.map(i => ({ group: 'Ocorrências', title: i.titulo, sub: OC_TXT[i.status], run: () => { go('ocorrencias'); openIncident(i.id); } }));
  const avs = db.notices.map(n => ({ group: 'Avisos', title: n.titulo, run: () => go('avisos') }));
  return [...acts, ...pages, ...units, ...ocs, ...avs].filter(it => norm(it.key || it.title).includes(qq)).slice(0, 14);
}
function renderPal() {
  let html = '', g = '';
  palItems.forEach((it, i) => { if (it.group !== g) { g = it.group; html += `<div class="pal-g">${g}</div>`; } html += `<button type="button" class="pal-it" role="option" data-action="pal-run" data-i="${i}" aria-selected="${i === palIdx}"><span>${esc(it.title)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</button>`; });
  $('#pal-res').innerHTML = html || '<div class="empty" style="margin:8px">Nada encontrado.</div>';
  const sel = $('#pal-res [aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest' });
}

/* ---------- modal, toast, tooltip, render ---------- */
function openModal(title, html, opts = {}) {
  const prev = $('#layer .modal'), scroll = opts.refresh && prev ? prev.scrollTop : 0;
  const openDetails = opts.refresh ? $$('#layer details[open]').length > 0 : false;
  modalState = { kind: opts.kind || 'form', id: opts.id };
  $('#layer').innerHTML = `<div class="overlay" data-action="close-overlay" ${opts.refresh ? 'style="animation:none"' : ''}><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${opts.refresh ? 'style="animation:none"' : ''}><div class="modal-head"><h2>${esc(title)}</h2>${opts.head || ''}<button class="icon-btn" type="button" data-action="close" aria-label="Fechar">${ico('x')}</button></div><div class="modal-body">${html}</div></div></div>`;
  const m = $('#layer .modal'); m.scrollTop = scroll;
  if (openDetails) { const d = $('#layer details'); if (d) d.open = true; }
  if (opts.focus) { const f = $('#layer .modal-body input:not([type=hidden]), #layer .modal-body textarea'); if (f) f.focus(); }
  else if (!opts.refresh) $('#layer [data-action="close"]').focus();
}
const closeModal = () => { $('#layer').innerHTML = ''; modalState = null; };
let toastT, toastUndo = null;
function toast(msg, undo) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" class="toast-btn" data-action="undo">Desfazer</button>' : ''}`;
  toastUndo = undo || null; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; toastUndo = null; }, undo ? 6000 : 2600);
}
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
function posTip(e) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 12; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }
document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (!el) return; tip.textContent = el.dataset.tip; tip.hidden = false; posTip(e); });
document.addEventListener('pointermove', e => { if (!tip.hidden) posTip(e); });
document.addEventListener('pointerout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });

function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = $$('#view [data-count]'); if (!els.length) return;
  const F = { money: moneyShort, pct: x => x.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%', int: x => String(Math.round(x)) };
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3); els.forEach(el => { if (el.isConnected) el.textContent = F[el.dataset.fmt](p < 1 ? +el.dataset.count * e : +el.dataset.count); }); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

  'edit-notice': el => newNotice(db.notices.find(n => n.id === el.dataset.id)),
  pin: el => { const n = db.notices.find(x => x.id === el.dataset.id); if (n) act(n.fixado ? 'Aviso desafixado' : 'Aviso fixado no topo', () => { n.fixado = !n.fixado; }); },
  'del-notice': el => act('Aviso excluído', () => { db.notices = db.notices.filter(n => n.id !== el.dataset.id); }),
  'copy-notice': el => { const n = db.notices.find(x => x.id === el.dataset.id); if (n) copyText(`*${n.titulo}*\n\n${n.texto}\n\nAdministração ${db.condo.nome}`, 'Texto copiado. Cole no grupo dos moradores.'); },
  reset: el => { if (!armed(el)) return; act('Dados de exemplo restaurados', () => { db = seed(); ui.finMonth = CUR; ui.calMonth = CUR; ui.sel.clear(); }); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || !A[el.dataset.action]) return;
  tip.hidden = true;
  A[el.dataset.action](el, e);
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input, textarea, select');
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); modalState && modalState.kind === 'palette' ? closeModal() : openPalette(); return; }
  if (e.key === '/' && !typing && !modalState) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape' && modalState) { closeModal(); return; }
  if (e.target.id === 'pal-q') {
    if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = Math.min(palItems.length - 1, palIdx + 1); renderPal(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = Math.max(0, palIdx - 1); renderPal(); }
    if (e.key === 'Enter') { e.preventDefault(); runPal(palIdx); }
    return;
  }
  if (modalState && modalState.kind === 'unit' && !typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { A['unit-step']({ dataset: { d: e.key === 'ArrowLeft' ? -1 : 1 } }); return; }
  if (e.key === 'Enter' && !typing && e.target.matches('[data-action="unit"], [data-action="incident"]') && e.target.tagName !== 'BUTTON') A[e.target.dataset.action](e.target);
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca-unidade') { ui.unitQuery = e.target.value; $('#units-table').innerHTML = unitsTable(); $('#facade-box').innerHTML = facade(unitMatches); }
  if (e.target.id === 'pal-q') { palItems = palSearch(e.target.value); palIdx = 0; renderPal(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'b-data') updateAvail();
  if (t.matches('.sel')) { t.checked ? ui.sel.add(t.dataset.id) : ui.sel.delete(t.dataset.id); t.closest('tr').classList.toggle('selected', t.checked); updateBulk(); }
  if (t.id === 'sel-all') { $$('.sel').forEach(cb => { cb.checked = t.checked; t.checked ? ui.sel.add(cb.dataset.id) : ui.sel.delete(cb.dataset.id); cb.closest('tr').classList.toggle('selected', t.checked); }); updateBulk(); }
});
/* Arrastar e soltar no quadro de ocorrências */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); tip.hidden = true; });
document.addEventListener('dragend', () => $$('.dragging, .drop-over').forEach(x => x.classList.remove('dragging', 'drop-over')));
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); $$('.drop-over').forEach(x => x !== col && x.classList.remove('drop-over')); col.classList.add('drop-over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); col.classList.remove('drop-over'); moveIncident(e.dataTransfer.getData('text/plain'), col.dataset.drop); });

const FORMS = {
  unit: f => { const u = unitById(f.dataset.id), d = new FormData(f); act('Dados do morador salvos', () => { u.morador = String(d.get('morador')).trim() || u.morador; u.telefone = String(d.get('telefone')).trim(); u.tipo = d.get('tipo'); }); },
  expense: f => {
    const d = new FormData(f), err = f.querySelector('.form-err');
    const valor = Number(String(d.get('valor')).replace(/\./g, '').replace(',', '.'));
    if (!(valor > 0)) { err.textContent = 'Informe um valor maior que zero, por exemplo 1.250,00.'; err.hidden = false; return; }
    act(`Despesa de ${money(valor)} lançada`, () => { db.expenses.push({ id: uid(), data: d.get('data'), categoria: d.get('categoria'), descricao: String(d.get('descricao')).trim(), valor: round2(valor) }); ui.finMonth = String(d.get('data')).slice(0, 7); });
  },
  oc: f => {
    const d = new FormData(f), det = String(d.get('detalhe') || '').trim();
    closeModal();
    act('Ocorrência registrada', () => { const historico = [{ em: nowISO(), texto: 'Ocorrência registrada' }]; if (det) historico.push({ em: nowISO(), texto: det }); db.incidents.push({ id: uid(), titulo: String(d.get('titulo')).trim(), unitId: d.get('unitId') || null, categoria: d.get('categoria'), prioridade: d.get('prioridade'), status: 'aberta', data: TODAY_ISO, historico }); });
  },
  'oc-comment': f => { const i = db.incidents.find(x => x.id === f.dataset.id), t = String(new FormData(f).get('texto')).trim(); if (i && t) act('Atualização adicionada', () => i.historico.push({ em: nowISO(), texto: t })); },
  booking: f => {
    const d = new FormData(f), err = f.querySelector('.form-err');
    const b = { id: uid(), area: d.get('area'), unitId: d.get('unitId'), data: d.get('data'), periodo: d.get('periodo') };
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!b.area || !b.periodo) return fail('Escolha um horário livre na tabela.');
    if (b.data < TODAY_ISO) return fail('Escolha uma data a partir de hoje.');
    if (db.bookings.some(x => x.area === b.area && x.data === b.data && x.periodo === b.periodo)) return fail('Esse horário acabou de ser reservado. Escolha outro.');
    if (unitStatus(b.unitId) === 'inadimplente') return fail(`${unitLabel(b.unitId)} tem cobranças em atraso. Regularize antes de reservar.`);
    closeModal();
    act(`${AREAS[b.area]} reservado para ${fmtDate(b.data)}`, () => { db.bookings.push(b); ui.calMonth = b.data.slice(0, 7); });
  },
  parcel: f => { const d = new FormData(f); closeModal(); act(`Encomenda registrada para ${unitLabel(d.get('unitId'))}`, () => db.parcels.push({ id: uid(), unitId: d.get('unitId'), transportadora: d.get('transportadora'), descricao: String(d.get('descricao')).trim(), chegada: nowISO(), retiradaEm: null, retiradoPor: null })); },
  visitor: f => { const d = new FormData(f); closeModal(); act(`Entrada de ${String(d.get('nome')).trim()} registrada`, () => db.visitors.push({ id: uid(), nome: String(d.get('nome')).trim(), unitId: d.get('unitId'), tipo: d.get('tipo'), entrada: nowISO(), saida: null })); },
  notice: f => {
    const d = new FormData(f), id = d.get('id');
    const data = { titulo: String(d.get('titulo')).trim(), texto: String(d.get('texto')).trim(), fixado: !!d.get('fixado') };
    closeModal();
    if (id) act('Aviso atualizado', () => Object.assign(db.notices.find(n => n.id === id), data));
    else { if (view !== 'avisos') { view = 'avisos'; location.hash = 'avisos'; } act('Aviso publicado', () => db.notices.push({ id: uid(), data: TODAY_ISO, ...data })); }
  }
};
document.addEventListener('submit', e => { const f = e.target; if (!FORMS[f.dataset.form]) return; e.preventDefault(); FORMS[f.dataset.form](f); });

window.addEventListener('hashchange', () => route());
route(true);
})();
</script>
</body>
</html>
